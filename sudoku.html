<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數獨</title>
<style>
:root{--bg:#e8edf1;--panel:#f7f9fb;--ink:#1b2a41;--sub:#5b6b7f;--line:#b9c4cf;--acc:#1f7a8c;--tint:#d3e6ea;--tint2:#a9d0d8;--err:#c8553d;--errbg:#f6d9d2;--given:#1b2a41;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10171f;--panel:#18222d;--ink:#e6edf3;--sub:#8fa0b2;--line:#34445a;--acc:#5cc2d4;--tint:#1f3441;--tint2:#2b5566;--err:#ff8f78;--errbg:#44251f;--given:#e6edf3}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10171f;--panel:#18222d;--ink:#e6edf3;--sub:#8fa0b2;--line:#34445a;--acc:#5cc2d4;--tint:#1f3441;--tint2:#2b5566;--err:#ff8f78;--errbg:#44251f;--given:#e6edf3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:14px 12px 24px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.1em}
#time{font-variant-numeric:tabular-nums;color:var(--sub);font-size:18px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:15px;padding:8px 0;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--bg);font-weight:700}
#board{display:grid;grid-template-columns:repeat(9,1fr);width:100%;aspect-ratio:1;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--panel);touch-action:manipulation}
.c{position:relative;display:flex;align-items:center;justify-content:center;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);color:var(--acc);font:inherit;font-size:clamp(18px,6.4vw,28px);padding:0;cursor:pointer;min-width:0}
.c.br{border-right:2px solid var(--ink)}.c.bb{border-bottom:2px solid var(--ink)}
.c.lc{border-right:0}.c.lr{border-bottom:0}
.c.g{color:var(--given);font-weight:800}
.c.p{background:var(--tint)}.c.s2{background:var(--tint2)}
.c.sel{background:var(--acc);color:var(--bg)}
.c.err{color:var(--err);background:var(--errbg)}
.c:focus-visible{outline:3px solid var(--err);outline-offset:-3px;z-index:2}
.nt{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(7px,2.3vw,10px);color:var(--sub);line-height:1;text-align:center;pointer-events:none}
.nt span{display:flex;align-items:center;justify-content:center}
.c.sel .nt{color:var(--bg)}
#pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:14px}
#pad button{position:relative;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:22px;font-weight:700;padding:10px 0 14px;border-radius:8px;cursor:pointer}
#pad button small{position:absolute;bottom:2px;left:0;right:0;font-size:10px;font-weight:400;color:var(--sub)}
#pad button:disabled{opacity:.3;cursor:default}
#tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
#tools button{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:10px 0;border-radius:8px;cursor:pointer}
#tools button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:14px;margin-top:12px}
#win{position:fixed;inset:0;background:rgba(10,18,28,.6);display:none;align-items:center;justify-content:center;padding:20px}
#win.show{display:flex}
#win div{background:var(--panel);border-radius:14px;padding:26px 28px;text-align:center;max-width:320px}
#win h2{margin:0 0 6px;font-size:24px}
#win p{margin:0 0 18px;color:var(--sub)}
#win button{border:0;background:var(--acc);color:var(--bg);font:inherit;font-size:16px;font-weight:700;padding:10px 24px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<main>
<header><h1>數獨</h1><div id="time">00:00</div></header>
<div class="seg" id="diff">
<button data-d="40">簡單</button><button data-d="32" class="on">普通</button><button data-d="26">困難</button>
</div>
<div id="board" role="grid" aria-label="數獨盤面"></div>
<div id="pad"></div>
<div id="tools">
<button id="bNote">筆記：關</button><button id="bUndo">復原</button><button id="bErase">清除</button><button id="bHint">提示 (0)</button>
</div>
<label><input type="checkbox" id="chk" checked>即時標示錯誤</label>
<div id="win"><div><h2>完成！</h2><p id="winTxt"></p><button id="again">再玩一局</button></div></div>
</main>
<script>
(function(){
var board=document.getElementById('board'),pad=document.getElementById('pad');
var cells=[],padBtns=[],vals,notes,given,sol,sel=-1,noteMode=false,hist=[],hints=0,secs=0,timer=null,clues=32,over=false;
function pc(m){var n=0;while(m){m&=m-1;n++}return n}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function solve(g,limit,rand){
  var R=[],C=[],B=[],i,n=0,out=null;
  for(i=0;i<9;i++)R[i]=C[i]=B[i]=0;
  for(i=0;i<81;i++)if(g[i]){var b=1<<(g[i]-1);R[(i/9)|0]|=b;C[i%9]|=b;B[((i/27)|0)*3+(((i%9)/3)|0)]|=b}
  function rec(){
    var best=-1,bm=0,bc=10,k,r,c,bx,m,cnt;
    for(k=0;k<81;k++)if(!g[k]){
      r=(k/9)|0;c=k%9;bx=((r/3)|0)*3+((c/3)|0);
      m=~(R[r]|C[c]|B[bx])&511;cnt=pc(m);
      if(cnt<bc){bc=cnt;best=k;bm=m;if(!cnt)return}
    }
    if(best<0){n++;if(rand)out=g.slice();return}
    r=(best/9)|0;c=best%9;bx=((r/3)|0)*3+((c/3)|0);
    var ds=[];for(k=1;k<=9;k++)if(bm&(1<<(k-1)))ds.push(k);
    if(rand)shuffle(ds);
    for(var j=0;j<ds.length;j++){
      var d=ds[j],bit=1<<(d-1);
      g[best]=d;R[r]|=bit;C[c]|=bit;B[bx]|=bit;
      rec();
      g[best]=0;R[r]&=~bit;C[c]&=~bit;B[bx]&=~bit;
      if(n>=limit)return;
    }
  }
  rec();
  return rand?out:n;
}
function newGame(){
  var full=solve(new Array(81).fill(0),1,true);
  sol=full.slice();
  var p=full.slice(),idx=shuffle(Array.from({length:81},function(_,i){return i})),left=81;
  for(var k=0;k<81&&left>clues;k++){
    var i=idx[k],old=p[i];p[i]=0;
    if(solve(p.slice(),2,false)!==1)p[i]=old;else left--;
  }
  vals=p.slice();given=p.map(function(v){return v>0});notes=new Array(81).fill(0);
  hist=[];hints=0;secs=0;sel=-1;over=false;
  document.getElementById('win').classList.remove('show');
  clearInterval(timer);timer=setInterval(function(){if(!over){secs++;showTime()}},1000);
  showTime();render();
}
function showTime(){var m=Math.floor(secs/60),s=secs%60;document.getElementById('time').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function build(){
  for(var i=0;i<81;i++){
    var b=document.createElement('button'),r=(i/9)|0,c=i%9;
    b.className='c'+(c%3==2&&c<8?' br':'')+(r%3==2&&r<8?' bb':'')+(c==8?' lc':'')+(r==8?' lr':'');
    b.setAttribute('role','gridcell');b.dataset.i=i;
    b.addEventListener('click',function(){sel=+this.dataset.i;render()});
    board.appendChild(b);cells.push(b);
  }
  for(var d=1;d<=9;d++){
    var q=document.createElement('button');q.dataset.d=d;q.innerHTML=d+'<small></small>';
    q.addEventListener('click',function(){put(+this.dataset.d)});
    pad.appendChild(q);padBtns.push(q);
  }
}
function render(){
  var sv=sel>=0?vals[sel]:0,sr=(sel/9)|0,sc=sel%9,chk=document.getElementById('chk').checked,cnt=new Array(10).fill(0);
  for(var i=0;i<81;i++){
    var el=cells[i],r=(i/9)|0,c=i%9,v=vals[i],cl=el.className.replace(/ (g|p|s2|sel|err)\b/g,'');
    if(given[i])cl+=' g';
    if(sel>=0){
      if(i===sel)cl+=' sel';
      else if(v&&v===sv)cl+=' s2';
      else if(r===sr||c===sc||(((r/3)|0)===((sr/3)|0)&&((c/3)|0)===((sc/3)|0)))cl+=' p';
    }
    if(chk&&v&&!given[i]&&v!==sol[i])cl+=' err';
    el.className=cl;
    if(v){el.textContent=v;if(v===sol[i])cnt[v]++}
    else if(notes[i]){var h='<div class="nt">';for(var d=1;d<=9;d++)h+='<span>'+((notes[i]>>(d-1))&1?d:'')+'</span>';el.innerHTML=h+'</div>'}
    else el.textContent='';
  }
  for(var d=1;d<=9;d++){padBtns[d-1].disabled=cnt[d]>=9;padBtns[d-1].lastChild.textContent='剩 '+(9-cnt[d])}
  document.getElementById('bNote').textContent='筆記：'+(noteMode?'開':'關');
  document.getElementById('bNote').classList.toggle('on',noteMode);
  document.getElementById('bHint').textContent='提示 ('+hints+')';
}
function snap(){hist.push([vals.slice(),notes.slice()]);if(hist.length>200)hist.shift()}
function put(d){
  if(sel<0||given[sel]||over)return;
  snap();
  if(noteMode&&!vals[sel]){notes[sel]^=1<<(d-1)}
  else{
    vals[sel]=d;notes[sel]=0;
    var r=(sel/9)|0,c=sel%9;
    for(var i=0;i<81;i++){var ri=(i/9)|0,ci=i%9;
      if(ri===r||ci===c||(((ri/3)|0)===((r/3)|0)&&((ci/3)|0)===((c/3)|0)))notes[i]&=~(1<<(d-1))}
  }
  render();checkWin();
}
function checkWin(){
  for(var i=0;i<81;i++)if(vals[i]!==sol[i])return;
  over=true;
  document.getElementById('winTxt').textContent='用時 '+document.getElementById('time').textContent+'，使用提示 '+hints+' 次';
  document.getElementById('win').classList.add('show');
}
document.getElementById('bNote').onclick=function(){noteMode=!noteMode;render()};
document.getElementById('bUndo').onclick=function(){if(over||!hist.length)return;var h=hist.pop();vals=h[0];notes=h[1];render()};
document.getElementById('bErase').onclick=function(){if(sel<0||given[sel]||over)return;snap();vals[sel]=0;notes[sel]=0;render()};
document.getElementById('bHint').onclick=function(){
  if(sel<0||given[sel]||over||vals[sel]===sol[sel])return;
  snap();vals[sel]=sol[sel];notes[sel]=0;hints++;render();checkWin();
};
document.getElementById('chk').onchange=render;
document.getElementById('again').onclick=newGame;
document.getElementById('diff').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  clues=+b.dataset.d;
  [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});
  newGame();
});
document.addEventListener('keydown',function(e){
  if(e.key>='1'&&e.key<='9'){put(+e.key);return}
  if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){document.getElementById('bErase').click();return}
  if(e.key==='n'||e.key==='N'){noteMode=!noteMode;render();return}
  var mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-9,ArrowDown:9}[e.key];
  if(mv&&sel>=0){var t=sel+mv,ok=(mv===-1&&sel%9>0)||(mv===1&&sel%9<8)||(mv===-9&&t>=0)||(mv===9&&t<81);if(ok){sel=t;render();cells[sel].focus();e.preventDefault()}}
});
build();newGame();
})();
</script>
</body>
</html>
